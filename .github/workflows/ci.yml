name: ci

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  ci:
    runs-on: ubuntu-latest
    container: ghcr.io/jdx/mise:2026.8.7
    steps:
      - uses: actions/checkout@main
      - run: |
          mise trust
          mise deps
          mise run build
          mise run index
